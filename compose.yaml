name: portfolio-paytrack
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: local_demo_password
      POSTGRES_DB: paytrack
    ports:
      - '127.0.0.1:55442:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio -d paytrack']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
